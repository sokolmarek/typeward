name: Docs CI

# The documentation site in docs/ is its own npm project, so this runs only
# when something under it (or this workflow family) changes.
on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-*.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-*.yml'
  workflow_dispatch:

# Read-only: this workflow never publishes anything.
permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: docs

jobs:
  check:
    name: Check + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Astro check
        run: npm run check
      # The build is the quality gate: starlight-links-validator fails it on any
      # broken internal link, and Pagefind indexing runs as part of it.
      - name: Build (link validation + Pagefind index)
        run: npm run build
      - name: Assert the search index was generated
        run: test -f dist/pagefind/pagefind.js
